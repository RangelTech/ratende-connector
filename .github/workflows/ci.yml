name: CI

# produto-15 (26/08/2026, pedido direto do dono): repo publico, build da
# extensao e upload do zip pronto pra instalar no Chrome direto num bucket
# GCS publico (`rangel-tech-ratende-connector`, criado via Terraform em
# `rangel-tech-foundation/gcp/main.tf`, isolado do resto do projeto -- so
# esse bucket eh publico). O card de download no Dashboard do
# `agent-platform` aponta pra essa URL fixa, entao o nome do objeto no
# bucket NUNCA muda (senao o link do card quebra a cada build).
#
# Auth via Workload Identity Federation, mesmo padrao ja usado nos outros
# repos da org (`github-deployer` SA, `roles/storage.admin` no projeto --
# ver rangel-tech-foundation). Variaveis de repo (GCP_PROJECT_ID,
# GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_DEPLOYER_SERVICE_ACCOUNT) setadas via
# `gh variable set` no repo `RangelTech/ratende-connector`.
#
# 26/08/2026 (pedido do dono): alem do zip pra "carregar sem compactacao",
# gera um .crx assinado (chave permanente em segredo do repo,
# RATENDE_CONNECTOR_SIGNING_KEY -- NUNCA rotacionar, o ID da extensao
# `ndamceimnbinifibkmegcfhidgjamiaf` depende dela pra sempre) + o update
# manifest que o Chrome consulta pra auto-atualizar, e instaladores que
# escrevem a politica ExtensionInstallForcelist (Windows via .bat + registro,
# Linux via .deb real) -- assim o usuario final so roda o instalador uma vez
# e o navegador instala a extensao sozinho, sem "Modo desenvolvedor".
#
# Sem certificado de assinatura de codigo (Authenticode) pago ainda -- o
# .exe do Windows fica sem assinatura, o Windows Defender/SmartScreen
# pode alertar na primeira execucao ate isso ser resolvido (decisao do
# dono, precisa comprar de uma CA).
#
# Instalador Windows via NSIS de verdade (nao so um .bat cru): o job
# `build-windows-installer` roda em `windows-latest` especificamente
# porque o runner do GitHub tem `choco`/admin de fabrica -- nao dava pra
# instalar NSIS localmente no ambiente de dev (sem permissao de
# administrador nesse sandbox). `.bat` continua publicado tambem, como
# fallback mais simples.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install & build
        run: |
          npm ci
          npm run build
      - name: Empacota o zip pronto pra "Carregar sem compactacao" no Chrome
        working-directory: dist
        run: zip -r ../ratende-connector.zip .
      - name: Empacota o .crx assinado (chave permanente do repo)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          SIGNING_KEY: ${{ secrets.RATENDE_CONNECTOR_SIGNING_KEY }}
        run: |
          echo "$SIGNING_KEY" > /tmp/ratende-connector-key.pem
          which google-chrome || sudo apt-get update && sudo apt-get install -y google-chrome-stable
          google-chrome --headless --pack-extension="$(pwd)/dist" \
            --pack-extension-key=/tmp/ratende-connector-key.pem --no-sandbox
          mv dist.crx ratende-connector.crx
          rm -f /tmp/ratende-connector-key.pem
      - name: Gera o update manifest (Chrome consulta pra auto-atualizar)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cat > update_manifest.xml <<EOF
          <?xml version='1.0' encoding='UTF-8'?>
          <gupdate xmlns='http://www.google.com/update2/response' protocol='2.0'>
            <app appid='ndamceimnbinifibkmegcfhidgjamiaf'>
              <updatecheck codebase='https://storage.googleapis.com/rangel-tech-ratende-connector/ratende-connector.crx' version='${VERSION}' />
            </app>
          </gupdate>
          EOF
      - name: Empacota o instalador Linux (.deb real, dpkg-deb nativo do runner)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          PKG=ratende-connector-installer
          ROOT=/tmp/$PKG
          mkdir -p "$ROOT/DEBIAN"
          cat > "$ROOT/DEBIAN/control" <<EOF
          Package: $PKG
          Version: $VERSION
          Section: web
          Priority: optional
          Architecture: all
          Maintainer: Rangel Tech <contato@rangeltech.net>
          Description: Instala a politica do Chrome/Chromium pra puxar a extensao RAtende Connector automaticamente, sem precisar de Modo desenvolvedor.
          EOF
          cat > "$ROOT/DEBIAN/postinst" <<'EOF'
          #!/bin/sh
          set -e
          EXT_ID="ndamceimnbinifibkmegcfhidgjamiaf"
          UPDATE_URL="https://storage.googleapis.com/rangel-tech-ratende-connector/update_manifest.xml"
          for dir in /etc/opt/chrome/policies/managed /etc/chromium/policies/managed /etc/chromium-browser/policies/managed; do
            mkdir -p "$dir"
            cat > "$dir/ratende-connector.json" <<POLICY
          {
            "ExtensionInstallForcelist": ["${EXT_ID};${UPDATE_URL}"]
          }
          POLICY
          done
          exit 0
          EOF
          cat > "$ROOT/DEBIAN/postrm" <<'EOF'
          #!/bin/sh
          set -e
          rm -f /etc/opt/chrome/policies/managed/ratende-connector.json
          rm -f /etc/chromium/policies/managed/ratende-connector.json
          rm -f /etc/chromium-browser/policies/managed/ratende-connector.json
          exit 0
          EOF
          chmod 755 "$ROOT/DEBIAN/postinst" "$ROOT/DEBIAN/postrm"
          dpkg-deb --build --root-owner-group "$ROOT" "ratende-connector-installer.deb"
      - uses: actions/upload-artifact@v4
        with:
          name: ratende-connector-build
          path: |
            ratende-connector.zip
            ratende-connector.crx
            update_manifest.xml
            ratende-connector-installer.deb
            installers/Instalar-RAtende-Connector.bat
            installers/Desinstalar-RAtende-Connector.bat
            installers/instalar-ratende-connector.sh
            installers/instalar-ratende-connector-mac.sh
            installers/desinstalar-ratende-connector-mac.sh
          retention-days: 7
          if-no-files-found: warn

  build-windows-installer:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instala NSIS e WiX (runner Windows ja roda como admin, sem essa trava do dev local)
        run: |
          choco install nsis -y --no-progress
          choco install wixtoolset -y --no-progress
      - name: Compila o instalador .exe (NSIS -- wizard, auto-eleva UAC)
        shell: pwsh
        working-directory: installers
        run: |
          & "C:\Program Files (x86)\NSIS\makensis.exe" ratende-connector.nsi
      - name: Compila o instalador .msi (WiX -- formato corporativo, msiexec cuida da elevacao sozinho)
        shell: pwsh
        working-directory: installers
        run: |
          $version = (Get-Content ../package.json | ConvertFrom-Json).version -replace '-.*', ''
          Write-Host "Versao lida do package.json: $version"
          $candle = Get-ChildItem "C:\Program Files (x86)\WiX Toolset*\bin\candle.exe" | Select-Object -First 1
          $light = Get-ChildItem "C:\Program Files (x86)\WiX Toolset*\bin\light.exe" | Select-Object -First 1
          $versionDefine = "-dProductVersion=$version"
          & $candle.FullName $versionDefine ratende-connector.wxs
          & $light.FullName -out RAtende-Connector-Instalador.msi ratende-connector.wixobj
      - uses: actions/upload-artifact@v4
        with:
          name: ratende-connector-windows-installer
          path: |
            installers/RAtende-Connector-Instalador.exe
            installers/RAtende-Connector-Instalador.msi
          retention-days: 7

  publish-download:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [build, build-windows-installer]
    concurrency:
      group: ratende-connector-download-publish
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ratende-connector-build
      - uses: actions/download-artifact@v4
        with:
          name: ratende-connector-windows-installer
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Sobe tudo pro bucket publico (nomes fixos -- links nunca mudam)
        run: |
          gcloud storage cp ratende-connector.zip \
            gs://rangel-tech-ratende-connector/ratende-connector.zip \
            --cache-control="no-cache, max-age=0"
          gcloud storage cp ratende-connector.crx \
            gs://rangel-tech-ratende-connector/ratende-connector.crx \
            --cache-control="no-cache, max-age=0"
          gcloud storage cp update_manifest.xml \
            gs://rangel-tech-ratende-connector/update_manifest.xml \
            --cache-control="no-cache, max-age=0"
          gcloud storage cp ratende-connector-installer.deb \
            gs://rangel-tech-ratende-connector/ratende-connector-installer.deb \
            --cache-control="no-cache, max-age=0"
          gcloud storage cp installers/Instalar-RAtende-Connector.bat \
            gs://rangel-tech-ratende-connector/Instalar-RAtende-Connector.bat \
            --cache-control="no-cache, max-age=0"
          gcloud storage cp installers/Desinstalar-RAtende-Connector.bat \
            gs://rangel-tech-ratende-connector/Desinstalar-RAtende-Connector.bat \
            --cache-control="no-cache, max-age=0"
          gcloud storage cp installers/instalar-ratende-connector.sh \
            gs://rangel-tech-ratende-connector/instalar-ratende-connector.sh \
            --cache-control="no-cache, max-age=0"
          gcloud storage cp installers/instalar-ratende-connector-mac.sh \
            gs://rangel-tech-ratende-connector/instalar-ratende-connector-mac.sh \
            --cache-control="no-cache, max-age=0"
          gcloud storage cp installers/desinstalar-ratende-connector-mac.sh \
            gs://rangel-tech-ratende-connector/desinstalar-ratende-connector-mac.sh \
            --cache-control="no-cache, max-age=0"
          gcloud storage cp RAtende-Connector-Instalador.exe \
            gs://rangel-tech-ratende-connector/RAtende-Connector-Instalador.exe \
            --cache-control="no-cache, max-age=0"
          gcloud storage cp RAtende-Connector-Instalador.msi \
            gs://rangel-tech-ratende-connector/RAtende-Connector-Instalador.msi \
            --cache-control="no-cache, max-age=0"
